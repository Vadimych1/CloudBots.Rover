<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot control panel</title>
</head>
<body style="padding: 0; margin: 0; overflow: hidden; font-family: sans-serif;">
    <canvas id="canvas" width="700" height="500" style="background-color: black; image-rendering: pixelated;" ></canvas>
    
    <div class="controls" style="display: flex; flex-direction: row; justify-content: space-evenly; align-items: center;">
        <p class="info">Info...</p>
        <p class="status">Disconnected</p>
    
        <div>
            <input type="text" id="addr" placeholder="WebSocket IP:PORT">
            <input type="button" id="connect" value="Connect">
        </div>

        <div style="display: flex; flex-direction: row;">
            <button id="left"><</button>
            <div style="display: flex; flex-direction: column;">
                <button id="up">/\</button>
                <button id="down">\/</button>
            </div>
            <button id="right">></button>
        </div>

        <input type="range" min="0.1" max="5" value="1" id="zoom">

        <button onclick="(() => {
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'clearmap',
                }));
            }
        })()">Clear map</button>
    </div>
    
</body>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const info = document.querySelector('.info');
    const status = document.querySelector('.status');

    const addr = document.getElementById('addr');
    const connect = document.getElementById('connect');
    const zoom = document.getElementById('zoom');

    canvas.width = window.innerWidth
    canvas.height = window.innerHeight - 100

    var x = 0, y = 0;

    document.getElementById("up").addEventListener("click", function () {
        y += 30;
    });
    document.getElementById("down").addEventListener("click", function () {
        y -= 30;
    });
    document.getElementById("left").addEventListener("click", function () {
        x += 30;
    });
    document.getElementById("right").addEventListener("click", function () {
        x -= 30;
    });


    canvas.addEventListener("click", function (e) {
        if (ws && ws.readyState == WebSocket.OPEN)
        ws.send(JSON.stringify({
            "type": "move",
            "x": (- x + e.clientX + chunks_offsets.x) / 300 * 1000, // convert coordinates from image to map
            "y": (- y + e.clientY + chunks_offsets.y) / 300 * 1000, // convert coordinates from image to map
        }))
    })

    let chunks_offsets = {"x": 0, "y": 0}

    connect.addEventListener("click", () => {
        if (addr.value.length == 0) return;
        ws = new WebSocket(addr.value);

        ws.onopen = () => {
            status.innerHTML = "Connected";
        };

        ws.onclose = (e) => {
            console.log(e)
            status.innerHTML = "Disconnected";
        };

        ws.onerror = () => {
            console.log(e)
            status.innerHTML = "Error";
        }

        ws.onmessage = (e) => {
            // ws://192.168.0.19:1026
            try {
                let j = JSON.parse(e.data);

                if (j.type == "data") {
                    info.innerHTML = `x: ${j.data.x} y: ${j.data.y} phi: ${j.data.phi}`;
                } else if (j.type == "map_render") {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    let img = new Image();
                    img.src = j.data;
                    img.onload = () => {
                        ctx.drawImage(img, x, y, img.width / zoom.value, img.height / zoom.value);
                    }

                    chunks_offsets = j.chunk_minus_offset

                    console.log("Got image!")
                }
            } catch (e) {
                console.error(e)
            }
        }

        setInterval(() => {
            if (ws && ws.readyState == WebSocket.OPEN)
            ws.send('{"type": "data"}');
        }, 300);

        setInterval(() => {
            if (ws && ws.readyState == WebSocket.OPEN)
            ws.send('{"type": "map"}');
        }, 1500);
    });

    var ws;
</script>

</html>
